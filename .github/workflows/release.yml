name: Package and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate tag and unified version
        id: version
        shell: pwsh
        run: |
          $version = & ./scripts/get-version.ps1
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Tag must match Directory.Build.props.' }
          "TRANSLATE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = & ./scripts/install-inno.ps1
          "ISCC_PATH=$iscc" >> $env:GITHUB_ENV
      - name: Build, check and package
        shell: pwsh
        run: ./build.ps1 -CI -Package
      - name: Upload packages for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Translate-${{ env.TRANSLATE_VERSION }}-win-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/releases/${{ env.TRANSLATE_VERSION }}/Translate-Setup-*.exe
            artifacts/releases/${{ env.TRANSLATE_VERSION }}/Translate-Portable-*.zip
            artifacts/releases/${{ env.TRANSLATE_VERSION }}/SHA256SUMS.txt
  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Translate-${{ needs.package.outputs.version }}-win-x64
          path: artifacts/releases/${{ needs.package.outputs.version }}
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
